<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0" />
  <meta name="theme-color" content="#22384C" />
  <title>津和野まち歩き</title>
  <meta name="description" content="津和野町内の観光施設・文化財・お土産物店を地図と一覧から簡単に探せる案内アプリ" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script type="module" crossorigin src="./assets/index-CCCKisA1.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Btvx2kBO.css">
</head>
<body>
  <div id="app">

    <!-- ヘッダー -->
    <header class="app-header">
      <div class="app-title-row">
        <img src="./favicon.svg" alt="" class="app-logo" aria-hidden="true" />
        <h1 class="app-title">津和野まち歩き</h1>
      </div>
      <p class="app-tagline">津和野の、ここが分かる。</p>
    </header>

    <!-- カテゴリーボタン -->
    <nav class="category-bar" aria-label="カテゴリーで絞り込み">
      <button class="cat-btn is-active" data-category="all">すべて</button>
      <button class="cat-btn" data-category="観光">観光</button>
      <button class="cat-btn" data-category="文化財">文化財</button>
      <button class="cat-btn" data-category="お土産">お土産</button>
    </nav>

    <!-- 種類（小カテゴリー）ボタン。多い場合は折りたたむ -->
    <nav id="subcategory-bar" class="subcategory-bar" aria-label="種類で絞り込み" hidden></nav>

    <!-- 地図 / 一覧 切り替えタブ -->
    <div class="view-tabs" role="tablist" aria-label="表示切り替え">
      <button class="tab-btn is-active" data-view="map" role="tab" aria-selected="true">
        <span class="tab-icon" data-icon="map" aria-hidden="true"></span>地図
      </button>
      <button class="tab-btn" data-view="list" role="tab" aria-selected="false">
        <span class="tab-icon" data-icon="list" aria-hidden="true"></span>一覧
      </button>
    </div>

    <main class="app-main">

      <!-- 地図画面 -->
      <section id="view-map" class="view-panel is-active" aria-label="地図画面">
        <div id="map"></div>
        <div class="map-floating-buttons">
          <button id="btn-locate" class="btn-primary btn-locate">
            <span class="btn-icon" data-icon="crosshair" aria-hidden="true"></span> 現在地を表示
          </button>
        </div>
      </section>

      <!-- 一覧画面 -->
      <section id="view-list" class="view-panel" aria-label="一覧画面">
        <div class="search-bar">
          <label for="search-input" class="visually-hidden">名称を検索</label>
          <input id="search-input" type="search" placeholder="名称を検索（例：稲成神社）" autocomplete="off" />
        </div>
        <p id="list-status" class="list-status" aria-live="polite"></p>
        <div id="list-container" class="list-container"></div>
      </section>

    </main>

    <!-- 詳細画面（オーバーレイ） -->
    <section id="view-detail" class="view-detail" aria-label="詳細画面" hidden>
      <div class="detail-inner">
        <button id="btn-back" class="btn-back">
          <span class="btn-icon" data-icon="back" aria-hidden="true"></span> 戻る
        </button>
        <div id="detail-content" class="detail-content"></div>
      </div>
    </section>

    <p id="offline-note" class="offline-note" hidden>
      通信状態が悪いようです。表示できる情報が限られる場合があります。
    </p>

  </div>

</body>
</html>
